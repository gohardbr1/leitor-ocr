<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitor Multi-Armazém</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
        header { text-align: center; padding: 12px 0; border-bottom: 1px solid #334155; margin-bottom: 12px; }
        h1 { font-size: 1.25rem; color: #38bdf8; text-transform: uppercase; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
        .stat-value { font-size: 2.2rem; font-weight: 800; color: #4ade80; line-height: 1.1; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-top: 4px; }
        
        .camera-container { position: relative; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8; margin-bottom: 12px; min-height: 250px; display: flex; align-items: center; justify-content: center; }
        #reader { width: 100%; }
        #switch-camera-btn { position: absolute; bottom: 15px; right: 15px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; color: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; z-index: 10; }
        
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 20px; }
        #feedback-overlay.success { background-color: rgba(22, 101, 52, 0.95); }
        #feedback-overlay.error { background-color: rgba(153, 27, 27, 0.98); }
        .feedback-title { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 8px; }
        .feedback-code { font-size: 1.2rem; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 8px; color: #f8fafc; font-family: monospace; }
        
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .btn { padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; color: white; }
        .btn-success { background: #16a34a; } .btn-danger { background: #dc2626; }
        
        .list-container { background: #1e293b; border-radius: 10px; border: 1px solid #334155; padding: 12px; flex-grow: 1; display: flex; flex-direction: column; max-height: 250px; }
        .list-header { font-size: 0.85rem; font-weight: 700; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .scanned-list { list-style: none; overflow-y: auto; flex-grow: 1; margin-bottom: 5px;}
        .scanned-item { background: #0f172a; border: 1px solid #334155; padding: 8px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 0.85rem; }
        .scanned-code { font-family: monospace; font-weight: 600; color: #38bdf8; }
        .scanned-time { color: #64748b; }
    </style>
</head>
<body>

    <header>
        <h1>📦 Conferencia Multi-Local</h1>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="count-total">0</div>
            <div class="stat-label">Conferidos Hoje</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="count-meta">--</div>
            <div class="stat-label">Meta Diária</div>
        </div>
    </div>

    <div class="camera-container">
        <div id="reader"></div>
        <button id="switch-camera-btn" onclick="toggleCamera()">🔄 Girar Câmera</button>
    </div>

    <div class="actions-grid">
        <button class="btn btn-success" onclick="exportCSV()">📥 Baixar Relatório</button>
        <button class="btn btn-danger" onclick="clearData()">🗑️ Limpar Aparelho</button>
    </div>

    <div class="list-container">
        <div class="list-header">
            <span>ÚLTIMOS PACOTES</span>
            <span style="color: #4ade80; font-size: 0.75rem;">● Nuvem Ativa</span>
        </div>
        <ul class="scanned-list" id="scanned-list"></ul>
    </div>

    <div id="feedback-overlay">
        <div class="feedback-title" id="feedback-title">OK!</div>
        <div class="feedback-code" id="feedback-code">---</div>
    </div>

    <script>
        const WEBHOOK_URL_FIXA = "https://script.google.com/macros/s/AKfycbwE4ovN8IgXd0NAZeYkYIpd3s4tQ6iTG8cql6Y3K1KWsHSELM9CQDMm_0I7wr8d_ZRT/exec"; 
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeepSuccess() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }
        function playBeepError() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        let scannedCodes = new Map(); 
        let html5QrcodeScanner = null;
        let isProcessing = false;
        let currentFacingMode = "environment"; 

        const todayStr = new Date().toISOString().split('T')[0];
        const STORAGE_KEY = 'conferencia_ml_' + todayStr;

        window.onload = function() { loadSavedData(); initScanner(); };

        function loadSavedData() {
            const rawData = localStorage.getItem(STORAGE_KEY);
            if (rawData) JSON.parse(rawData).forEach(item => scannedCodes.set(item.code, item.time));
            updateUI();
        }

        function saveData() {
            const arr = Array.from(scannedCodes.entries()).map(([code, time]) => ({ code, time }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        }

        function initScanner() {
            if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");
            // Motor Turbo 30 fps
            const config = { fps: 30, qrbox: { width: 280, height: 150 }, aspectRatio: 1.0 };
            html5QrcodeScanner.start({ facingMode: currentFacingMode }, config, onScanSuccess).catch(err => console.error(err));
        }

        function toggleCamera() {
            const btn = document.getElementById('switch-camera-btn');
            btn.innerHTML = "⏳...";
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                html5QrcodeScanner.stop().then(() => {
                    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                    initScanner(); btn.innerHTML = "🔄 Girar Câmera";
                }).catch(err => { btn.innerHTML = "🔄 Girar Câmera"; });
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            const cleanCode = decodedText.trim().toUpperCase();
            const timeNow = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            if (scannedCodes.has(cleanCode)) {
                playBeepError(); showOverlay('error', '⚠️ DUPLICADO!', cleanCode);
            } else {
                scannedCodes.set(cleanCode, timeNow);
                saveData(); playBeepSuccess(); showOverlay('success', '✓ CONFERIDO', cleanCode);
                sendToGoogleSheets(cleanCode, timeNow); updateUI();
            }
            setTimeout(() => { isProcessing = false; }, 1000); 
        }

        function showOverlay(type, title, code) {
            const overlay = document.getElementById('feedback-overlay');
            overlay.className = type; document.getElementById('feedback-title').innerText = title; document.getElementById('feedback-code').innerText = code;
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 1400);
        }

        function updateUI() {
            document.getElementById('count-total').innerText = scannedCodes.size;
            const listEl = document.getElementById('scanned-list'); listEl.innerHTML = '';
            Array.from(scannedCodes.entries()).reverse().forEach(([code, time]) => {
                const li = document.createElement('li'); li.className = 'scanned-item';
                li.innerHTML = `<span class="scanned-code">${code}</span><span class="scanned-time">${time}</span>`;
                listEl.appendChild(li);
            });
        }

        function sendToGoogleSheets(code, time) {
            if (!WEBHOOK_URL_FIXA || WEBHOOK_URL_FIXA === "COLE_AQUI_A_NOVA_URL_DO_APPS_SCRIPT") return;
            
            const formData = new URLSearchParams();
            formData.append('action', 'bipar');
            formData.append('codigo', code);
            formData.append('horario', time);
            formData.append('data', todayStr);

            fetch(WEBHOOK_URL_FIXA, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).catch(err => console.error("Erro na nuvem:", err));
        }

        function exportCSV() {
            if (scannedCodes.size === 0) return alert("Nenhum pacote conferido hoje ainda!");
            let csvContent = "data:text/csv;charset=utf-8,Data,Hora,Codigo_Pacote\n";
            scannedCodes.forEach((time, code) => { csvContent += `${todayStr},${time},"${code}"\n`; });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `lote_${todayStr}.csv`); document.body.appendChild(link);
            link.click(); document.body.removeChild(link);
        }

        function clearData() {
            if (confirm("Resetar a contagem deste aparelho? Apenas o celular será zerado.")) {
                scannedCodes.clear(); localStorage.removeItem(STORAGE_KEY); updateUI();
            }
        }
    </script>
</body>
</html>
