<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expedição OCR - Versão Blindada (V4)</title>
    <!-- Tesseract.js via CDN (IA Nativa no Navegador) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
        
        header { text-align: center; padding: 10px; background: #1e293b; border-bottom: 1px solid #334155; }
        h1 { font-size: 1.1rem; color: #38bdf8; }
        .subtitle { font-size: 0.75rem; color: #94a3b8; }

        #btn-toggle-camera { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border: 1px solid #38bdf8; color: white; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; z-index: 60; cursor: pointer; }

        .camera-wrapper { position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }

        /* Máscara de foco precisa para 9 dígitos */
        .focus-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .target-box { width: 85%; height: 75px; border: 3px solid #facc15; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); background: transparent; position: relative; }
        .target-box::after { content: "ALINHE OS 9 DÍGITOS TIKTOK AQUI"; position: absolute; bottom: -20px; width: 100%; text-align: center; color: #facc15; font-size: 0.7rem; font-weight: bold; }

        /* Painel de Resultados */
        .result-panel { background: #1e293b; padding: 15px; border-top: 1px solid #334155; max-height: 45vh; display: flex; flex-direction: column; }
        .result-header { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; text-align: center; }
        .scanned-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .scanned-item { background: #0f172a; border: 1px solid #334155; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center; }
        .scanned-code { font-family: monospace; font-weight: bold; color: #4ade80; font-size: 1.1rem; letter-spacing: 1px; }
        .scanned-time { font-size: 0.75rem; color: #64748b; }

        #debug-text { font-size: 0.7rem; color: #94a3b8; margin-top: 5px; text-align: center; min-height: 1rem; }

        /* MODAL DE DUPLICIDADE (TELA VERMELHA AGRESSIVA) */
        #duplicate-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(185, 28, 28, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 20px; color: #fff; animation: pulse 0.3s infinite; }
        .dup-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .dup-code { font-size: 2rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; font-family: monospace; }
        
        /* Oculta canvas de processamento */
        canvas { display: none; }

        @keyframes pulse { 0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.9; } }
    </style>
</head>
<body>

    <button id="btn-toggle-camera" onclick="toggleCamera()">🔄 Girar</button>

    <header>
        <h1>🧪 OCR Blindado V4</h1>
        <div class="subtitle">Filtro de Ruído & Duplicidade Ativa</div>
    </header>

    <div class="camera-wrapper">
        <video id="video" playsinline autoplay></video>
        <div class="focus-mask">
            <div class="target-box" id="target-box"></div>
        </div>
    </div>

    <div class="result-panel">
        <div class="result-header">Lidos Hoje (Maps Persistente)</div>
        <ul class="scanned-list" id="scanned-list"></ul>
        <div id="debug-text">Iniciando câmera...</div>
    </div>

    <canvas id="proc-canvas"></canvas>

    <div id="duplicate-overlay">
        <div class="dup-title">⚠️ DUPLICADO!</div>
        <div class="dup-title" style="font-size: 1.2rem; margin-top: -10px; font-weight: 400;">CÓDIGO JÁ CONFERIDO</div>
        <div class="dup-code" id="feedback-dup-code">---</div>
    </div>

    <script>
        // Configurações Técnicas
        const CONFIG = {
            whitelisted_chars: '0123456789', // Whitelist rigorosa para números
            regex_pattern: /^\d{9}$/,      // Exatamente 9 dígitos do TikTok
            debounce_time_ms: 1800,        // Trava de leitura para o mesmo código
            scan_interval_ms: 600,         // Intervalo de processamento de frame
            brightness_threshold: 40        // Abaixo disso, ignora (Câmera tampada)
        };

        const video = document.getElementById('video');
        const procCanvas = document.getElementById('proc-canvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        const scannedList = document.getElementById('scanned-list');
        const debugText = document.getElementById('debug-text');
        const dupOverlay = document.getElementById('duplicate-overlay');
        const dupCodeText = document.getElementById('feedback-dup-code');
        
        let scannedCodes = new Map(); // Maps para conferência de duplicidade
        let isProcessing = false;
        let ocrWorker = null;
        let scanInterval = null;
        let audioCtx = null; // Áudio reutilizado para evitar memory leak
        let currentFacingMode = "environment"; 

        const todayStr = new Date().toISOString().split('T')[0];
        const STORAGE_KEY = 'conferencia_tiktok_' + todayStr;

        // Inicialização Global
        window.onload = async function() {
            try {
                loadSavedData();
                await initOCR();
                await startCamera();
                // Inicializa contexto de áudio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (err) {
                console.error(err);
                debugText.innerText = "Falha crítica na inicialização.";
            }
        };

        // Persistência de Dados (Maps em LocalStorage)
        function loadSavedData() {
            try {
                const rawData = localStorage.getItem(STORAGE_KEY);
                if (rawData) {
                    const arr = JSON.parse(rawData);
                    arr.forEach(item => scannedCodes.set(item.code, item.time));
                    updateUI();
                }
            } catch(e) { console.error(e); localStorage.removeItem(STORAGE_KEY); }
        }

        function saveData(code, time) {
            scannedCodes.set(code, time);
            const arr = Array.from(scannedCodes.entries()).map(([code, time]) => ({ code, time }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
            updateUI();
        }

        // Inicializa Câmera
        async function startCamera() {
            try {
                if(video.srcObject) { video.srcObject.getTracks().forEach(track => track.stop()); }

                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        focusMode: { ideal: "continuous" }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        debugText.innerText = "Câmera ativa. Alinhe o código.";
                        startScanLoop();
                        resolve();
                    };
                });
            } catch (err) {
                debugText.innerText = `Erro câmera: ${err.message}`;
                throw err;
            }
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera().catch(e => debugText.innerText = `Falha troca câmera: ${e.message}`);
        }

        // Inicializa Inteligência de Leitura (OCR)
        async function initOCR() {
            debugText.innerText = "Inicializando IA de leitura (Pode levar segundos)...";
            try {
                ocrWorker = await Tesseract.createWorker({
                    // Reduz mensagens de log para leveza
                    logger: m => { if (m.status === 'initializing api') debugText.innerText = "Ajustando motor..." }
                });
                await ocrWorker.loadLanguage('por'); // Idioma para auxiliar contraste
                await ocrWorker.initialize('por');
                // Whitelist rigorosa: ignora qualquer coisa que não seja número
                await ocrWorker.setParameters({
                    tessedit_char_whitelist: CONFIG.whitelisted_chars,
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK, // Lê como bloco único
                });
                debugText.innerText = "OCR Pronto.";
            } catch (err) {
                debugText.innerText = `Erro IA: ${err.message}`;
                throw err;
            }
        }

        function startScanLoop() {
            if (scanInterval) clearInterval(scanInterval);
            scanInterval = setInterval(captureAndScan, CONFIG.scan_interval_ms);
        }

        // === CORE DO PROCESSAMENTO: Caputra, Filtro Anti-Fantasma, OCR e Validação ===
        async function captureAndScan() {
            if (isProcessing || !ocrWorker) return;
            isProcessing = true;

            const targetBox = document.getElementById('target-box');
            const boxRect = targetBox.getBoundingClientRect();
            const videoRect = video.getBoundingClientRect();

            const scaleX = video.videoWidth / videoRect.width;
            const scaleY = video.videoHeight / videoRect.height;

            const cropX = (boxRect.left - videoRect.left) * scaleX;
            const cropY = (boxRect.top - videoRect.top) * scaleY;
            const cropW = boxRect.width * scaleX;
            const cropH = boxRect.height * scaleY;

            procCanvas.width = cropW;
            procCanvas.height = cropH;

            procCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            const imgData = procCtx.getImageData(0, 0, cropW, cropH);
            
            // === FILTRO ANTI-FANTASMA OPERACIONAL ===
            if (isImageTooDark(imgData)) {
                isProcessing = false;
                // debugText.innerText = "Ruído detectado (Câmera obstruída)";
                return; // ABORTA O OCR AQUI
            }

            // Pré-processamento agressivo para leitura térmica
            applyContrastEnhancement(procCtx, imgData);

            try {
                const { data: { text } } = await ocrWorker.recognize(procCanvas);
                // Limpa o texto: remove espaços, quebras e sujeiras que sobraram
                const cleanText = text.replace(/[^0-9]/g, '').trim();
                
                debugText.innerText = `Lido: "${cleanText}"`; // Feedback visual rápido
                
                checkCodePattern(cleanText);
            } catch (err) {
                console.error(err);
            } finally {
                isProcessing = false;
            }
        }

        // === GUARDA DE LUMINÂNCIA (FILTRO ANTI-FANTASMA) ===
        // Abaixo do threshold definido, ignora o OCR para não ler ruído digital
        function isImageTooDark(imgData) {
            const pixels = imgData.data;
            let totalLuma = 0;
            const numPixels = imgData.width * imgData.height;

            for (let i = 0; i < pixels.length; i += 4) {
                // Cálculo rápido de luminância (Luma BT.709)
                const luma = 0.2126 * pixels[i] + 0.7152 * pixels[i+1] + 0.0722 * pixels[i+2];
                totalLuma += luma;
            }
            const avgLuma = totalLuma / numPixels;
            // debugText.innerText = `Luminância: ${avgLuma.toFixed(1)}`; // Debug
            return avgLuma < CONFIG.brightness_threshold; 
        }

        // Binarização e Contraste Otimizado para Texto Numérico
        function applyContrastEnhancement(ctx, imgData) {
            const pixels = imgData.data;
            for (let i = 0; i < pixels.length; i += 4) {
                const luma = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
                // Binarização Otsu-like simplificada para leitura térmica
                const threshold = 110; 
                const value = luma < threshold ? 0 : 255;
                pixels[i] = value;
                pixels[i + 1] = value;
                pixels[i + 2] = value;
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Validação e Conferência de Duplicidade
        let lastSuccessfulRead = null;
        let lastReadTime = 0;

        function checkCodePattern(text) {
            const now = Date.now();

            // Regra 1: Atende ao padrão de 9 dígitos do TikTok?
            if (CONFIG.regex_pattern.test(text)) {
                
                // Debounce Operacional: Evita bipar o mesmo código múltiplas vezes seguidas
                if (text === lastSuccessfulRead && (now - lastReadTime) < CONFIG.debounce_time_ms) {
                    return; 
                }

                // === CONFERÊNCIA DE DUPLICIDADE (Usando o Maps) ===
                if (scannedCodes.has(text)) {
                    // == CÓDIGO JÁ CONFERIDO ==
                    playBeepDuplicate(); // Som de erro grave
                    showDuplicateOverlay(text); // Tela Vermelha
                } else {
                    // == CÓDIGO NOVO (CONFERIDO COM SUCESSO) ==
                    lastSuccessfulRead = text;
                    lastReadTime = now;
                    
                    const timeNow = new Date().toLocaleTimeString('pt-BR');
                    saveData(text, timeNow); // Salva no LocalStorage e no Maps
                    playBeepSuccess(); // Bip de sucesso
                    
                    // Efeito visual na tela (flash verde)
                    document.body.style.backgroundColor = "#166534";
                    setTimeout(() => { document.body.style.backgroundColor = "#0f172a"; }, 300);
                }
            }
        }

        // UI e Feedbacks
        function updateUI() {
            scannedList.innerHTML = '';
            // Converte Map para Array e inverte para mostrar o mais recente no topo
            Array.from(scannedCodes.entries()).reverse().forEach(([code, time]) => {
                const li = document.createElement('li');
                li.className = 'scanned-item';
                li.innerHTML = `<span class="scanned-code">${code}</span><span class="scanned-time">${time}</span>`;
                scannedList.appendChild(li);
            });
        }

        function showDuplicateOverlay(code) {
            dupCodeText.innerText = code;
            dupOverlay.style.display = 'flex';
            // Trava o processamento por 2.5 segundos para o operador ver o erro
            isProcessing = true; 
            setTimeout(() => {
                dupOverlay.style.display = 'none';
                isProcessing = false;
            }, 2500);
        }

        // Gerador de Áudio Nativo (Sem arquivos .mp3)
        function playBeepSuccess() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime); // Som agudo (OK)
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function playBeepDuplicate() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Som grave (Erro)
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }
    </script>
</body>
</html>
