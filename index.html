<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expedição OCR Universal - V7 Blindagem Total + Anti-Desfoque</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; padding: 10px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #1e293b; margin-bottom: 8px; }
        h1 { font-size: 1rem; color: #38bdf8; font-weight: 800; text-transform: uppercase; }
        
        .camera-wrapper { position: relative; width: 100%; height: 260px; background: #000; border-radius: 10px; overflow: hidden; border: 2px solid #38bdf8; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        
        /* MIRA ATUALIZADA - LINHA SUPERIOR É O LASER */
        .target-box { 
            position: absolute; 
            width: 85%; 
            height: 70px; 
            border: 2px solid rgba(56, 189, 248, 0.4); /* Bordas suaves */
            border-top: 3px solid #ef4444; /* Laser Vermelho Forte */
            border-radius: 4px; 
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65); 
            pointer-events: none; 
            z-index: 10; 
        }
        .target-box::before { 
            content: "▼ POSICIONE O CÓDIGO AQUI ▼"; 
            position: absolute; 
            top: -22px; 
            width: 100%; 
            text-align: center; 
            color: #ef4444; 
            font-size: 0.65rem; 
            font-weight: 900; 
            letter-spacing: 1px;
        }

        .cam-btn { position: absolute; top: 10px; right: 10px; z-index: 20; background: rgba(15,23,42,0.8); border: 1px solid #38bdf8; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

        .status-bar { font-size: 0.75rem; text-align: center; color: #4ade80; font-weight: 600; min-height: 20px; margin-bottom: 8px; transition: color 0.2s; }
        .status-warning { color: #facc15; } /* Cor amarela para desfocado */

        .panel { background: #172033; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
        .panel-header { font-size: 0.75rem; font-weight: 700; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 8px; }
        
        .scanned-list { list-style: none; overflow-y: auto; flex-grow: 1; max-height: 220px; }
        .scanned-item { background: #0b0f19; border: 1px solid #1e293b; padding: 8px; border-radius: 4px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .code-text { font-family: monospace; font-size: 0.95rem; font-weight: 700; color: #38bdf8; }
        .code-type { font-size: 0.65rem; background: #334155; padding: 2px 6px; border-radius: 4px; color: #f8fafc; font-weight: bold; }

        /* OVERLAYS DE FEEDBACK CRÍTICO */
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 20px; }
        .bg-success { background: rgba(22, 101, 52, 0.96); }
        .bg-duplicate { background: rgba(185, 28, 28, 0.98); animation: pulseRed 0.4s infinite; }
        .fb-title { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .fb-code { font-size: 1.4rem; font-family: monospace; background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 8px; color: #fff; }

        @keyframes pulseRed { 0% { opacity: 0.85; } 50% { opacity: 1; } 100% { opacity: 0.85; } }
        canvas { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>📦 OCR Universal</h1>
        <span id="counter" style="font-size: 0.8rem; font-weight: bold; color: #4ade80;">Lidos: 0</span>
    </header>

    <div class="camera-wrapper">
        <video id="video" playsinline autoplay></video>
        <div class="target-box"></div>
        <button class="cam-btn" onclick="toggleCamera()">🔄 Câmera</button>
    </div>

    <div class="status-bar" id="status-text">Inicializando motor de inteligência...</div>

    <div class="panel">
        <div class="panel-header">
            <span>HISTÓRICO DE BIPAGEM (HOJE)</span>
            <button onclick="clearData()" style="background:none; border:none; color:#ef4444; font-size:0.7rem; cursor:pointer; font-weight:bold;">Limpar Lista</button>
        </div>
        <ul class="scanned-list" id="scanned-list"></ul>
    </div>

    <div id="feedback-overlay">
        <div class="fb-title" id="fb-title">✓ LIDO</div>
        <div class="fb-code" id="fb-code">---</div>
    </div>

    <canvas id="proc-canvas"></canvas>

    <script>
        let scannedCodes = new Map();
        let ocrWorker = null;
        let isProcessing = false;
        let audioCtx = null;
        let currentFacingMode = 'environment';
        
        let lastScannedCode = "";
        let lastScanTime = 0;
        
        const video = document.getElementById('video');
        const procCanvas = document.getElementById('proc-canvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const scannedList = document.getElementById('scanned-list');
        
        const todayStr = new Date().toISOString().split('T')[0];
        const STORAGE_KEY = 'exp_ocr_universal_' + todayStr;

        window.onload = async function() {
            loadSavedData();
            await initOCR();
            await startCamera();
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.body.addEventListener('click', () => {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });

            setInterval(captureAndRecognize, 450);
        };

        function loadSavedData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                JSON.parse(raw).forEach(i => scannedCodes.set(i.code, i.type));
                updateUI();
            }
        }

        function saveData() {
            const arr = Array.from(scannedCodes.entries()).map(([code, type]) => ({ code, type }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
            updateUI();
        }

        async function initOCR() {
            try {
                statusText.innerText = "Carregando OCR...";
                ocrWorker = await Tesseract.createWorker('eng');
                await ocrWorker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK
                });
                statusText.innerText = "Pronto! Aproxime o texto da mira.";
            } catch (e) {
                statusText.innerText = "Erro ao iniciar OCR: " + e.message;
            }
        }

        async function startCamera() {
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 }, focusMode: "continuous" }
                });
                video.srcObject = stream;
            } catch (e) {
                alert("Erro na câmera: " + e.message);
            }
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        async function captureAndRecognize() {
            if (!ocrWorker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;

            const box = document.querySelector('.target-box').getBoundingClientRect();
            const vRect = video.getBoundingClientRect();

            // Matemática original perfeita e reta - Apenas a área do Box
            const videoRatio = video.videoWidth / video.videoHeight;
            const elementRatio = vRect.width / vRect.height;

            let scale;
            let offsetX = 0;
            let offsetY = 0;

            if (elementRatio > videoRatio) {
                scale = vRect.width / video.videoWidth;
                const scaledHeight = video.videoHeight * scale;
                offsetY = (scaledHeight - vRect.height) / 2;
            } else {
                scale = vRect.height / video.videoHeight;
                const scaledWidth = video.videoWidth * scale;
                offsetX = (scaledWidth - vRect.width) / 2;
            }

            const relX = box.left - vRect.left;
            const relY = box.top - vRect.top;

            const cropX = (relX + offsetX) / scale;
            const cropY = (relY + offsetY) / scale;
            const cropW = box.width / scale;
            const cropH = box.height / scale;

            if (cropW <= 0 || cropH <= 0) return;

            procCanvas.width = cropW;
            procCanvas.height = cropH;
            procCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            const imgData = procCtx.getImageData(0, 0, cropW, cropH);
            
            // 1. Bloqueia se estiver escuro
            if (isTooDark(imgData)) {
                statusText.innerText = "Ambiente muito escuro...";
                statusText.className = "status-bar status-warning";
                return;
            }

            // 2. Bloqueia se estiver desfocado (Novo!)
            if (isBlurry(imgData)) {
                statusText.innerText = "Focando imagem...";
                statusText.className = "status-bar status-warning";
                return;
            }

            statusText.innerText = "Analisando...";
            statusText.className = "status-bar";

            isProcessing = true;
            try {
                const { data: { text } } = await ocrWorker.recognize(procCanvas);
                if (text) evaluateText(text);
            } catch (e) {
                console.error(e);
            } finally {
                if (document.getElementById('feedback-overlay').style.display !== 'flex') {
                    isProcessing = false;
                    statusText.innerText = "Pronto! Aproxime o texto da mira.";
                }
            }
        }

        function isTooDark(imgData) {
            let total = 0;
            const pixels = imgData.data;
            for (let i = 0; i < pixels.length; i += 16) {
                total += (0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2]);
            }
            return (total / (pixels.length / 16)) < 35;
        }

        // MOTOR ANTI-DESFOQUE: Verifica contraste e bordas fortes
        function isBlurry(imgData) {
            const pixels = imgData.data;
            const width = imgData.width;
            const height = imgData.height;
            let diffSum = 0;
            let count = 0;

            // Pula pixels para garantir performance e não travar o celular
            for (let y = 0; y < height - 2; y += 2) {
                for (let x = 0; x < width - 2; x += 2) {
                    const i = (y * width + x) * 4;
                    const right = (y * width + (x + 2)) * 4;
                    const bottom = ((y + 2) * width + x) * 4;

                    // Converte para escala de luminosidade (Luma)
                    const luma = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
                    const lumaRight = 0.299 * pixels[right] + 0.587 * pixels[right+1] + 0.114 * pixels[right+2];
                    const lumaBottom = 0.299 * pixels[bottom] + 0.587 * pixels[bottom+1] + 0.114 * pixels[bottom+2];

                    // Calcula a diferença entre o pixel atual e os adjacentes
                    diffSum += Math.abs(luma - lumaRight) + Math.abs(luma - lumaBottom);
                    count += 2;
                }
            }
            
            // Score de nitidez (quanto maior, mais focado). Abaixo de 8 costuma ser lixo/borrado.
            const score = diffSum / count;
            return score < 8; 
        }

        // MOTOR V7 - IMUNE À ALUCINAÇÕES E CORTES
        function evaluateText(rawText) {
            const flatText = rawText.replace(/[^A-Z0-9]/g, '');
            let code = null;
            let type = "";

            const matchCorreios = flatText.match(/([A-Z]{2})(\d{9})/);
            
            if (matchCorreios) {
                let prefix = matchCorreios[1];
                let middle = normalizeNum(matchCorreios[2]);
                code = prefix + middle + "BR"; 
                type = "CORREIOS";
            }
            else if (/(20000\d{11}|\d{16})/.test(flatText)) {
                const matchML = flatText.match(/(20000\d{11}|\d{16})/);
                code = matchML[0];
                type = "MERCADO LIVRE";
            }
            else {
                const tokens = rawText.split(/[\s\n\r]+/).map(t => t.replace(/[^A-Z0-9]/g, '')).filter(t => t.length >= 8);
                
                for (const token of tokens) {
                    const numOnly = normalizeNum(token);

                    if (/^\d{9}$/.test(numOnly) && token.length === 9) {
                        code = numOnly;
                        type = "TIKTOK";
                        break;
                    }
                    
                    const digitCount = (token.match(/\d/g) || []).length;
                    
                    if (token.length >= 10 && token.length <= 18 && digitCount >= 4) {
                        const isAllNumbers = /^\d+$/.test(numOnly); 
                        const startsWithTwoLetters = /^[A-Z]{2,}/.test(token); 

                        if (isAllNumbers || startsWithTwoLetters) {
                            code = token;
                            type = "SHOPEE / OUTROS";
                            break;
                        }
                    }
                }
            }

            if (code) {
                if (code === lastScannedCode && (Date.now() - lastScanTime) < 4000) return; 
                
                lastScannedCode = code;
                lastScanTime = Date.now();
                handleCodeScanned(code, type);
            }
        }

        function normalizeNum(str) {
            return str.replace(/O/g, '0').replace(/I/g, '1').replace(/L/g, '1').replace(/S/g, '5').replace(/Z/g, '2');
        }

        function handleCodeScanned(code, type) {
            if (scannedCodes.has(code)) {
                playAudio(false);
                showOverlay(`⚠️ DUPLICADO (${type})`, code, false);
            } else {
                scannedCodes.set(code, type);
                saveData();
                playAudio(true);
                showOverlay(`✓ LIDO (${type})`, code, true);
            }
        }

        function showOverlay(title, code, isSuccess) {
            const overlay = document.getElementById('feedback-overlay');
            document.getElementById('fb-title').innerText = title;
            document.getElementById('fb-code').innerText = code;

            overlay.className = isSuccess ? 'bg-success' : 'bg-duplicate';
            overlay.style.display = 'flex';
            
            isProcessing = true; 

            setTimeout(() => {
                overlay.style.display = 'none';
                isProcessing = false;
            }, 2000); 
        }

        function playAudio(isSuccess) {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (isSuccess) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) {}
        }

        function updateUI() {
            document.getElementById('counter').innerText = `Lidos: ${scannedCodes.size}`;
            scannedList.innerHTML = '';
            Array.from(scannedCodes.entries()).reverse().forEach(([code, type]) => {
                scannedList.innerHTML += `<li class="scanned-item"><span class="code-text">${code}</span><span class="code-type">${type}</span></li>`;
            });
        }

        function clearData() {
            if (confirm("Tem certeza? Isso vai limpar todos os códigos lidos HOJE neste celular.")) {
                scannedCodes.clear();
                localStorage.removeItem(STORAGE_KEY);
                updateUI();
            }
        }
    </script>
</body>
</html>
